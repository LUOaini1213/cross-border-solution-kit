# Freight, handling and service rates. ALL rates in this file are ILLUSTRATIVE round numbers in USD:
# they are not quotes, not any carrier's or forwarder's tariff, and must be replaced by tendered rates.
# Their scale is anchored to the public index values in `anchors` (REAL, with date and source).
anchors:
  drewry_wci_composite: {value: 4305, unit: USD per 40ft, date: 2026-11-12, label: REAL, source: drewry_wci,
                         note: "East-West composite; long-haul, used only as an upper reference"}
  drewry_wci_sha_rtm: {value: 3504, unit: USD per 40ft, date: 2026-11-12, label: REAL, source: drewry_wci, note: "Shanghai-Rotterdam"}
  drewry_iaci_composite: {value: 1440, unit: USD per 40ft, date: 2026-11-12, label: REAL, source: drewry_iaci,
                          note: "Intra-Asia composite spot rate, excludes origin/destination THC"}
  drewry_iaci_sha_lch: {value: 1557, unit: USD per 40ft, date: 2026-11-12, label: REAL, source: drewry_iaci, note: "Shanghai-Laem Chabang"}
  drewry_air_global: {value: 4.12, unit: USD per kg, date: 2026-10-30, label: REAL, source: drewry_air,
                      note: "East-West airport-to-airport buy rates, >1,000 kg; intra-Asia rates below are set lower"}
  fbx_global: {value: 3485.20, unit: USD per 40ft, date: 2026-11-15, label: REAL, source: freightos_fbx,
               note: "value displayed on the public page on the access date; the page shows no timestamp"}

