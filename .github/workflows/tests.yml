name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned requirements
        run: python -m pip install -r requirements.txt
      - name: Run tests (offline)
        run: python -m pytest -q
